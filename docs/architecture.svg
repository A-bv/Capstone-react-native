<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 520" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="980" height="520" rx="16" fill="#ffffff" stroke="#d7dedb" stroke-width="1.5"/>

  <text x="30" y="34" font-size="20" font-weight="700" fill="#22302b">How the app is built — by responsibility</text>
  <text x="30" y="54" font-size="12.5" fill="#5f6f6a">Every app is organized into the same kinds of parts. Here is each one, and what Little Lemon puts in it.</text>

  <!-- concern labels (name + plain meaning) -->
  <g text-anchor="middle">
    <rect x="14" y="98" width="172" height="52" rx="9" fill="#495E57"/>
    <text x="100" y="120" font-size="14" font-weight="700" fill="#ffffff">UI</text>
    <text x="100" y="138" font-size="10.5" fill="#cfe0da">what you see &amp; tap</text>
    <rect x="14" y="238" width="172" height="46" rx="9" fill="#495E57"/>
    <text x="100" y="258" font-size="14" font-weight="700" fill="#ffffff">Navigation</text>
    <text x="100" y="274" font-size="10.5" fill="#cfe0da">moving between screens</text>
    <rect x="14" y="306" width="172" height="46" rx="9" fill="#495E57"/>
    <text x="100" y="326" font-size="14" font-weight="700" fill="#ffffff">Logic</text>
    <text x="100" y="342" font-size="10.5" fill="#cfe0da">the app's rules</text>
    <rect x="14" y="382" width="172" height="52" rx="9" fill="#495E57"/>
    <text x="100" y="404" font-size="14" font-weight="700" fill="#ffffff">Data</text>
    <text x="100" y="422" font-size="10.5" fill="#cfe0da">the info it works with</text>
  </g>

  <!-- ===== UI ===== -->
  <rect x="198" y="92" width="760" height="130" rx="12" fill="#f4f7f6" stroke="#cfd8d4" stroke-width="1.5"/>
  <text x="214" y="112" font-size="11.5" font-weight="700" fill="#495E57">SCREENS — the pages you see</text>
  <g text-anchor="middle" fill="#243029" font-size="11.5" font-weight="700">
    <rect x="214" y="118" width="116" height="30" rx="7" fill="#ffffff" stroke="#cfd8d4" stroke-width="1.3"/><text x="272" y="138">Welcome</text>
    <rect x="338" y="118" width="116" height="30" rx="7" fill="#ffffff" stroke="#cfd8d4" stroke-width="1.3"/><text x="396" y="138">Sign in</text>
    <rect x="462" y="118" width="116" height="30" rx="7" fill="#ffffff" stroke="#cfd8d4" stroke-width="1.3"/><text x="520" y="138">Sign up</text>
    <rect x="586" y="118" width="116" height="30" rx="7" fill="#ffffff" stroke="#cfd8d4" stroke-width="1.3"/><text x="644" y="138">Home</text>
    <rect x="710" y="118" width="116" height="30" rx="7" fill="#ffffff" stroke="#cfd8d4" stroke-width="1.3"/><text x="768" y="138">About Us</text>
    <rect x="834" y="118" width="110" height="30" rx="7" fill="#ffffff" stroke="#cfd8d4" stroke-width="1.3"/><text x="889" y="138">Profile</text>
  </g>
  <text x="214" y="170" font-size="11.5" font-weight="700" fill="#495E57">REUSABLE PIECES</text>
  <g text-anchor="middle" fill="#243029" font-size="11.5" font-weight="700">
    <rect x="214" y="176" width="178" height="30" rx="7" fill="#ffffff" stroke="#cfd8d4" stroke-width="1.3"/><text x="303" y="196">Header</text>
    <rect x="400" y="176" width="178" height="30" rx="7" fill="#ffffff" stroke="#cfd8d4" stroke-width="1.3"/><text x="489" y="196">FormField</text>
    <rect x="586" y="176" width="178" height="30" rx="7" fill="#ffffff" stroke="#cfd8d4" stroke-width="1.3"/><text x="675" y="196">CustomButton</text>
    <rect x="772" y="176" width="172" height="30" rx="7" fill="#ffffff" stroke="#cfd8d4" stroke-width="1.3"/><text x="858" y="196">AboutUsImages</text>
  </g>
  <text x="944" y="112" text-anchor="end" font-size="10.5" fill="#8a7320">styling: NativeWind — colors &amp; fonts, set once</text>

  <!-- ===== Navigation ===== -->
  <rect x="198" y="236" width="760" height="50" rx="12" fill="#f4f7f6" stroke="#cfd8d4" stroke-width="1.5"/>
  <text x="214" y="259" font-size="12.5" font-weight="700" fill="#243029">Expo Router</text>
  <text x="214" y="275" font-size="11" fill="#5f6f6a">picks the first screen (are you signed in?), the sign-in / sign-up stack, and the main tab bar</text>

  <!-- ===== Logic ===== -->
  <rect x="198" y="304" width="760" height="50" rx="12" fill="#f4f7f6" stroke="#cfd8d4" stroke-width="1.5"/>
  <text x="214" y="327" font-size="12.5" font-weight="700" fill="#243029">Validation</text>
  <text x="214" y="343" font-size="11" fill="#5f6f6a">the sign-up form rules — required fields, a valid email, a long-enough password (validation.js)</text>

  <!-- ===== Data (State / Persistence / Networking) ===== -->
  <g>
    <rect x="198" y="376" width="245" height="68" rx="12" fill="#f4f7f6" stroke="#cfd8d4" stroke-width="1.5"/>
    <text x="214" y="396" font-size="12" font-weight="700" fill="#243029">State <tspan font-weight="400" fill="#5f6f6a" font-size="10.5">· in memory</tspan></text>
    <text x="214" y="414" font-size="10.5" fill="#5f6f6a">React's built-in state —</text>
    <text x="214" y="428" font-size="10.5" fill="#5f6f6a">form inputs, loading flags</text>

    <rect x="455" y="376" width="245" height="68" rx="12" fill="#f4f7f6" stroke="#cfd8d4" stroke-width="1.5"/>
    <text x="471" y="396" font-size="12" font-weight="700" fill="#243029">Persistence <tspan font-weight="400" fill="#5f6f6a" font-size="10.5">· on device</tspan></text>
    <text x="471" y="414" font-size="10.5" fill="#5f6f6a">storage.js saves &amp; loads the</text>
    <text x="471" y="428" font-size="10.5" fill="#5f6f6a">account via AsyncStorage</text>

    <rect x="712" y="376" width="246" height="68" rx="12" fill="#fbfbfa" stroke="#cfd8d4" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="728" y="396" font-size="12" font-weight="700" fill="#9aa5a1">Networking <tspan font-weight="400" font-size="10.5">· to a server</tspan></text>
    <text x="728" y="414" font-size="10.5" fill="#9aa5a1">None — there is no backend;</text>
    <text x="728" y="428" font-size="10.5" fill="#9aa5a1">all data stays on the device</text>
  </g>

  <text x="30" y="474" font-size="11" fill="#8a7320">Styling cuts across the UI: NativeWind + tailwind.config define the brand colors and fonts once, and every screen and piece uses them.</text>
</svg>
