<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 410" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7d8c87"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="980" height="410" rx="16" fill="#ffffff" stroke="#d7dedb" stroke-width="1.5"/>
  <text x="30" y="40" font-size="20" font-weight="700" fill="#22302b">How the app is built</text>

  <!-- ===== UI (hub) ===== -->
  <rect x="246" y="60" width="488" height="96" rx="12" fill="#e9f0ed" stroke="#495E57" stroke-width="2"/>
  <text x="266" y="86" font-size="14.5" fill="#22302b"><tspan font-weight="700">UI</tspan>  ·  <tspan font-weight="700" fill="#2f7d5b">React Native + NativeWind</tspan></text>
  <text x="266" y="110" font-size="11.5" fill="#243029"><tspan font-weight="700">Screens:</tspan> Welcome · Sign in · Sign up · Home · About Us · Profile</text>
  <text x="266" y="132" font-size="11.5" fill="#243029"><tspan font-weight="700">Components:</tspan> Header · FormField · CustomButton · AboutUsImages</text>

  <!-- arrows: task on the arrow, tool in the box -->
  <path d="M 360,156 V 182 H 170 V 212" fill="none" stroke="#7d8c87" stroke-width="2" marker-end="url(#ah)"/>
  <text x="265" y="176" text-anchor="middle" font-size="11" fill="#5f6f6a">move between screens</text>
  <path d="M 490,156 V 212" fill="none" stroke="#7d8c87" stroke-width="2" marker-end="url(#ah)"/>
  <text x="498" y="190" font-size="11" fill="#5f6f6a">validate the form</text>
  <path d="M 620,156 V 182 H 810 V 212" fill="none" stroke="#7d8c87" stroke-width="2" marker-end="url(#ah)"/>
  <text x="715" y="176" text-anchor="middle" font-size="11" fill="#5f6f6a">read &amp; save data</text>

  <!-- ===== Navigation ===== -->
  <rect x="40" y="212" width="270" height="138" rx="12" fill="#f4f7f6" stroke="#cfd8d4" stroke-width="1.5"/>
  <text x="58" y="238" font-size="12" font-weight="700" fill="#5f6f6a">NAVIGATION</text>
  <text x="58" y="262" font-size="15" font-weight="700" fill="#2f7d5b">Expo Router</text>
  <text x="58" y="280" font-size="10.5" fill="#5f6f6a">file-based routing</text>
  <text x="58" y="304" font-size="11.5" fill="#243029"><tspan font-weight="700">auth stack</tspan> — sign in / sign up</text>
  <text x="58" y="324" font-size="11.5" fill="#243029"><tspan font-weight="700">tab bar</tspan> — Home · About · Profile</text>

  <!-- ===== Logic ===== -->
  <rect x="350" y="212" width="270" height="138" rx="12" fill="#f4f7f6" stroke="#cfd8d4" stroke-width="1.5"/>
  <text x="368" y="238" font-size="12" font-weight="700" fill="#5f6f6a">LOGIC</text>
  <text x="368" y="262" font-size="15" font-weight="700" fill="#2f7d5b">validation.js</text>
  <text x="368" y="280" font-size="10.5" fill="#5f6f6a">form validation</text>
  <text x="368" y="304" font-size="11.5" fill="#243029">checks the sign-up form —</text>
  <text x="368" y="324" font-size="11.5" fill="#243029">email &amp; password, before saving</text>

  <!-- ===== Data ===== -->
  <rect x="660" y="212" width="280" height="138" rx="12" fill="#f4f7f6" stroke="#cfd8d4" stroke-width="1.5"/>
  <text x="678" y="238" font-size="12" font-weight="700" fill="#5f6f6a">DATA</text>
  <text x="678" y="266" font-size="11.5" fill="#243029"><tspan font-weight="700">local state</tspan> &#8594; <tspan font-weight="700" fill="#2f7d5b">useState</tspan> <tspan fill="#5f6f6a">(in memory)</tspan></text>
  <text x="678" y="294" font-size="11.5" fill="#243029"><tspan font-weight="700">persistence</tspan> &#8594; <tspan font-weight="700" fill="#2f7d5b">AsyncStorage</tspan> <tspan fill="#5f6f6a">(on device)</tspan></text>
  <text x="678" y="322" font-size="11.5" fill="#243029"><tspan font-weight="700">networking</tspan> &#8594; <tspan font-weight="700" fill="#9aa5a1">none</tspan></text>
</svg>
