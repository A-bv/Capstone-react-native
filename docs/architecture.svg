<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 462" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="980" height="462" rx="16" fill="#ffffff" stroke="#d7dedb" stroke-width="1.5"/>
  <text x="30" y="36" font-size="20" font-weight="700" fill="#22302b">How the app is built — by layer</text>

  <!-- Cross-cutting band -->
  <rect x="30" y="50" width="920" height="60" rx="10" fill="#FBF4D8" stroke="#ead98f" stroke-width="1.5"/>
  <text x="46" y="74" font-size="12" font-weight="700" fill="#5a4a10">CROSS-CUTTING <tspan font-weight="400">— applies to every layer below</tspan></text>
  <text x="46" y="96" font-size="11.5" fill="#243029"><tspan font-weight="700">Auth</tspan> local demo  ·  <tspan font-weight="700">Error handling</tspan> <tspan fill="#9aa5a1">none</tspan>  ·  <tspan font-weight="700">Logging</tspan> <tspan fill="#9aa5a1">none</tspan>  ·  <tspan font-weight="700">Config</tspan> <tspan fill="#9aa5a1">none</tspan>  ·  <tspan font-weight="700">i18n / a11y</tspan> <tspan fill="#9aa5a1">minimal</tspan>  ·  <tspan font-weight="700">Notifications</tspan> <tspan fill="#9aa5a1">none</tspan></text>

  <!-- Layer rows -->
  <!-- PRESENTATION -->
  <rect x="30" y="122" width="920" height="62" rx="10" fill="#f4f7f6" stroke="#cfd8d4" stroke-width="1.5"/>
  <rect x="44" y="134" width="162" height="38" rx="8" fill="#495E57"/>
  <text x="125" y="152" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">PRESENTATION</text>
  <text x="125" y="166" text-anchor="middle" font-size="9.5" fill="#cfe0da">what you see</text>
  <text x="224" y="157" font-size="11.5" fill="#243029"><tspan font-weight="700">UI</tspan> — <tspan font-weight="700" fill="#2f7d5b">React Native</tspan>    ·    <tspan font-weight="700">Styling</tspan> — <tspan font-weight="700" fill="#2f7d5b">NativeWind</tspan>    ·    <tspan font-weight="700">Navigation</tspan> — <tspan font-weight="700" fill="#2f7d5b">Expo Router</tspan></text>

  <!-- LOGIC -->
  <rect x="30" y="194" width="920" height="62" rx="10" fill="#f4f7f6" stroke="#cfd8d4" stroke-width="1.5"/>
  <rect x="44" y="206" width="162" height="38" rx="8" fill="#495E57"/>
  <text x="125" y="224" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">LOGIC</text>
  <text x="125" y="238" text-anchor="middle" font-size="9.5" fill="#cfe0da">the rules</text>
  <text x="224" y="229" font-size="11.5" fill="#243029"><tspan font-weight="700">State</tspan> — <tspan font-weight="700" fill="#2f7d5b">useState</tspan> <tspan fill="#5f6f6a">(local only)</tspan>    ·    <tspan font-weight="700">Business rules</tspan> — <tspan font-weight="700" fill="#2f7d5b">validation.js</tspan></text>

  <!-- DATA -->
  <rect x="30" y="266" width="920" height="62" rx="10" fill="#f4f7f6" stroke="#cfd8d4" stroke-width="1.5"/>
  <rect x="44" y="278" width="162" height="38" rx="8" fill="#495E57"/>
  <text x="125" y="296" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">DATA</text>
  <text x="125" y="310" text-anchor="middle" font-size="9.5" fill="#cfe0da">information</text>
  <text x="224" y="301" font-size="11.5" fill="#243029"><tspan font-weight="700">Networking</tspan> <tspan fill="#9aa5a1">none</tspan>    ·    <tspan font-weight="700">Persistence</tspan> — <tspan font-weight="700" fill="#2f7d5b">AsyncStorage</tspan>    ·    <tspan font-weight="700">Data shaping</tspan> <tspan fill="#9aa5a1">none</tspan></text>

  <!-- PLATFORM -->
  <rect x="30" y="338" width="920" height="62" rx="10" fill="#f4f7f6" stroke="#cfd8d4" stroke-width="1.5"/>
  <rect x="44" y="350" width="162" height="38" rx="8" fill="#495E57"/>
  <text x="125" y="368" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">PLATFORM</text>
  <text x="125" y="382" text-anchor="middle" font-size="9.5" fill="#cfe0da">the device</text>
  <text x="224" y="373" font-size="11.5" fill="#243029"><tspan font-weight="700" fill="#2f7d5b">Expo</tspan>-managed <tspan fill="#5f6f6a">(fonts, splash)</tspan>    ·    <tspan font-weight="700">Custom native</tspan> <tspan fill="#9aa5a1">none</tspan>    ·    <tspan font-weight="700">Permissions</tspan> <tspan fill="#9aa5a1">none</tspan></text>

  <!-- Delivery footer -->
  <text x="44" y="428" font-size="11" fill="#5f6f6a"><tspan font-weight="700">DELIVERY</tspan> (dev-time, not part of the running app) — <tspan font-weight="700" fill="#2f7d5b">Expo</tspan> build · <tspan font-weight="700" fill="#2f7d5b">Jest</tspan> tests · <tspan font-weight="700" fill="#2f7d5b">GitHub Actions</tspan> CI</text>
</svg>
