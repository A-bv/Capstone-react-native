<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 600" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7d8c87"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="980" height="600" rx="16" fill="#ffffff" stroke="#d7dedb" stroke-width="1.5"/>

  <!-- title -->
  <text x="32" y="38" font-size="21" font-weight="700" fill="#22302b">Little Lemon — app architecture</text>
  <text x="32" y="59" font-size="12.5" fill="#5f6f6a">Component view of the Expo app · file-based routing, reusable components, on-device storage, NativeWind styling</text>

  <!-- legend -->
  <rect x="686" y="18" width="270" height="52" rx="9" fill="#f7f9f8" stroke="#cfd8d4" stroke-width="1.2"/>
  <text x="700" y="35" font-size="11.5" font-weight="700" fill="#5f6f6a">LEGEND</text>
  <line x1="700" y1="50" x2="728" y2="50" stroke="#7d8c87" stroke-width="2" marker-end="url(#ah)"/>
  <text x="736" y="54" font-size="12" fill="#243029">navigation</text>
  <line x1="826" y1="50" x2="854" y2="50" stroke="#7d8c87" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ah)"/>
  <text x="862" y="54" font-size="12" fill="#243029">uses</text>

  <!-- band labels -->
  <g font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">
    <rect x="18" y="98" width="118" height="28" rx="8" fill="#495E57"/><text x="77" y="117">Navigation</text>
    <rect x="18" y="214" width="118" height="28" rx="8" fill="#495E57"/><text x="77" y="233">Screens</text>
    <rect x="18" y="404" width="118" height="28" rx="8" fill="#495E57"/><text x="77" y="423">Modules</text>
    <rect x="18" y="520" width="118" height="28" rx="8" fill="#495E57"/><text x="77" y="539">Styling</text>
  </g>

  <!-- ===== Navigation ===== -->
  <g text-anchor="middle" fill="#243029">
    <rect x="160" y="88" width="200" height="48" rx="10" fill="#EDEFEE" stroke="#cfd8d4" stroke-width="1.5"/>
    <text x="260" y="108" font-size="13.5" font-weight="700">app/_layout.jsx</text>
    <text x="260" y="125" font-size="11.5" fill="#5f6f6a">root stack · fonts, splash</text>
    <rect x="396" y="88" width="208" height="48" rx="10" fill="#EDEFEE" stroke="#cfd8d4" stroke-width="1.5"/>
    <text x="500" y="108" font-size="13.5" font-weight="700">app/index.jsx</text>
    <text x="500" y="125" font-size="11.5" fill="#5f6f6a">entry — reads saved user</text>
  </g>
  <line x1="360" y1="112" x2="394" y2="112" stroke="#7d8c87" stroke-width="2" marker-end="url(#ah)"/>

  <!-- entry branches -->
  <path d="M 452,136 V 158 H 243 V 202" fill="none" stroke="#7d8c87" stroke-width="2" marker-end="url(#ah)"/>
  <text x="300" y="152" font-size="11" fill="#5f6f6a">no saved user</text>
  <path d="M 560,136 V 158 H 773 V 180" fill="none" stroke="#7d8c87" stroke-width="2" marker-end="url(#ah)"/>
  <text x="628" y="152" font-size="11" fill="#5f6f6a">saved user</text>

  <!-- ===== Screens ===== -->
  <!-- Welcome -->
  <rect x="160" y="202" width="166" height="66" rx="11" fill="#f4f7f6" stroke="#cfd8d4" stroke-width="1.5"/>
  <text x="243" y="230" text-anchor="middle" font-size="13.5" font-weight="700" fill="#243029">welcomeScreen</text>
  <text x="243" y="248" text-anchor="middle" font-size="11.5" fill="#5f6f6a">onboarding · guest</text>

  <!-- (auth) -->
  <rect x="350" y="188" width="214" height="94" rx="12" fill="#f4f7f6" stroke="#cfd8d4" stroke-width="1.5"/>
  <text x="364" y="208" font-size="12.5" font-weight="700" fill="#495E57">(auth)</text>
  <g text-anchor="middle" fill="#243029" font-size="12.5" font-weight="700">
    <rect x="364" y="218" width="88" height="50" rx="9" fill="#ffffff" stroke="#cfd8d4" stroke-width="1.5"/>
    <text x="408" y="241">Sign in</text><text x="408" y="257" font-size="10" font-weight="400" fill="#5f6f6a">verify email</text>
    <rect x="462" y="218" width="88" height="50" rx="9" fill="#ffffff" stroke="#cfd8d4" stroke-width="1.5"/>
    <text x="506" y="241">Sign up</text><text x="506" y="257" font-size="10" font-weight="400" fill="#5f6f6a">validate · save</text>
  </g>

  <!-- (tabs) -->
  <rect x="600" y="188" width="346" height="94" rx="12" fill="#f4f7f6" stroke="#cfd8d4" stroke-width="1.5"/>
  <text x="614" y="208" font-size="12.5" font-weight="700" fill="#495E57">(tabs)</text>
  <g text-anchor="middle" fill="#243029" font-size="12.5" font-weight="700">
    <rect x="614" y="218" width="102" height="50" rx="9" fill="#ffffff" stroke="#cfd8d4" stroke-width="1.5"/>
    <text x="665" y="241">Home</text><text x="665" y="257" font-size="10" font-weight="400" fill="#5f6f6a">menu list</text>
    <rect x="726" y="218" width="102" height="50" rx="9" fill="#ffffff" stroke="#cfd8d4" stroke-width="1.5"/>
    <text x="777" y="241">About Us</text><text x="777" y="257" font-size="10" font-weight="400" fill="#5f6f6a">info · contact</text>
    <rect x="838" y="218" width="96" height="50" rx="9" fill="#ffffff" stroke="#cfd8d4" stroke-width="1.5"/>
    <text x="886" y="241">Profile</text><text x="886" y="257" font-size="10" font-weight="400" fill="#5f6f6a">user · logout</text>
  </g>

  <!-- screen-to-screen navigation -->
  <line x1="326" y1="235" x2="348" y2="235" stroke="#7d8c87" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="564" y1="235" x2="598" y2="235" stroke="#7d8c87" stroke-width="2" marker-end="url(#ah)"/>
  <text x="581" y="228" text-anchor="middle" font-size="10" fill="#5f6f6a">success</text>

  <!-- ===== Modules ===== -->
  <rect x="160" y="340" width="366" height="132" rx="12" fill="#f4f7f6" stroke="#cfd8d4" stroke-width="1.5"/>
  <text x="176" y="361" font-size="12.5" font-weight="700" fill="#495E57">components/ — reusable UI</text>
  <g text-anchor="middle" fill="#243029" font-size="12.5" font-weight="700">
    <rect x="176" y="372" width="162" height="40" rx="9" fill="#ffffff" stroke="#cfd8d4" stroke-width="1.5"/><text x="257" y="397">Header</text>
    <rect x="348" y="372" width="162" height="40" rx="9" fill="#ffffff" stroke="#cfd8d4" stroke-width="1.5"/><text x="429" y="397">FormField</text>
    <rect x="176" y="422" width="162" height="40" rx="9" fill="#ffffff" stroke="#cfd8d4" stroke-width="1.5"/><text x="257" y="447">CustomButton</text>
    <rect x="348" y="422" width="162" height="40" rx="9" fill="#ffffff" stroke="#cfd8d4" stroke-width="1.5"/><text x="429" y="447">AboutUsImages</text>
  </g>

  <rect x="566" y="340" width="380" height="132" rx="12" fill="#f4f7f6" stroke="#cfd8d4" stroke-width="1.5"/>
  <text x="582" y="361" font-size="12.5" font-weight="700" fill="#495E57">utils/ — data &amp; logic</text>
  <g text-anchor="middle" fill="#243029" font-size="12.5">
    <rect x="582" y="372" width="348" height="40" rx="9" fill="#ffffff" stroke="#cfd8d4" stroke-width="1.5"/>
    <text x="756" y="392" font-weight="700">validation.js</text><text x="756" y="406" font-size="10.5" fill="#5f6f6a">email &amp; password rules</text>
    <rect x="582" y="422" width="196" height="40" rx="9" fill="#ffffff" stroke="#cfd8d4" stroke-width="1.5"/>
    <text x="680" y="442" font-weight="700">storage.js</text><text x="680" y="456" font-size="10.5" fill="#5f6f6a">save / get / remove</text>
    <rect x="806" y="422" width="124" height="40" rx="9" fill="#EDEFEE" stroke="#cfd8d4" stroke-width="1.5"/>
    <text x="868" y="442" font-weight="700">AsyncStorage</text><text x="868" y="456" font-size="10.5" fill="#5f6f6a">on device</text>
  </g>
  <line x1="780" y1="442" x2="804" y2="442" stroke="#7d8c87" stroke-width="2" marker-end="url(#ah)"/>

  <!-- screens -> modules (uses, dashed) -->
  <line x1="300" y1="282" x2="300" y2="338" stroke="#7d8c87" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ah)"/>
  <text x="312" y="314" font-size="11" fill="#5f6f6a">compose</text>
  <line x1="756" y1="282" x2="756" y2="338" stroke="#7d8c87" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ah)"/>
  <text x="768" y="314" font-size="11" fill="#5f6f6a">reads / writes</text>

  <!-- ===== Styling ===== -->
  <rect x="160" y="512" width="786" height="46" rx="10" fill="#FBF4D8" stroke="#ead98f" stroke-width="1.5"/>
  <text x="553" y="540" text-anchor="middle" font-size="12.5" fill="#5a4a10"><tspan font-weight="700">NativeWind + tailwind.config</tspan> — brand color &amp; font tokens (Markazi, Karla) style every screen and component</text>
</svg>
