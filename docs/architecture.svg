<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 462" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7d8c87"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="980" height="462" rx="16" fill="#ffffff" stroke="#d7dedb" stroke-width="1.5"/>
  <text x="30" y="38" font-size="20" font-weight="700" fill="#22302b">How the app is built</text>

  <!-- ===== UI (hub) ===== -->
  <rect x="236" y="56" width="508" height="90" rx="12" fill="#e9f0ed" stroke="#495E57" stroke-width="2"/>
  <text x="256" y="80" font-size="12" font-weight="700" fill="#5f6f6a">UI</text>
  <text x="256" y="104" font-size="11.5" fill="#243029"><tspan font-weight="700">Role</tspan> — everything you see and tap</text>
  <text x="256" y="126" font-size="11.5" fill="#243029"><tspan font-weight="700">Uses</tspan> — <tspan font-weight="700" fill="#2f7d5b">React Native</tspan> <tspan fill="#5f6f6a">(framework)</tspan> + <tspan font-weight="700" fill="#2f7d5b">NativeWind</tspan> <tspan fill="#5f6f6a">(styling library)</tspan></text>

  <!-- arrows -->
  <path d="M 350,146 V 176 H 182 V 206" fill="none" stroke="#7d8c87" stroke-width="2" marker-end="url(#ah)"/>
  <text x="188" y="169" text-anchor="middle" font-size="10.5" fill="#8a9691">uses</text>
  <path d="M 490,146 V 206" fill="none" stroke="#7d8c87" stroke-width="2" marker-end="url(#ah)"/>
  <text x="500" y="178" font-size="10.5" fill="#8a9691">uses</text>
  <path d="M 630,146 V 176 H 810 V 206" fill="none" stroke="#7d8c87" stroke-width="2" marker-end="url(#ah)"/>
  <text x="804" y="169" text-anchor="middle" font-size="10.5" fill="#8a9691">uses</text>

  <!-- ===== Navigation ===== -->
  <rect x="40" y="206" width="285" height="94" rx="12" fill="#f4f7f6" stroke="#cfd8d4" stroke-width="1.5"/>
  <text x="58" y="230" font-size="12" font-weight="700" fill="#5f6f6a">NAVIGATION</text>
  <text x="58" y="256" font-size="11.5" fill="#243029"><tspan font-weight="700">Role</tspan> — moving between screens</text>
  <text x="58" y="280" font-size="11.5" fill="#243029"><tspan font-weight="700">Uses</tspan> — <tspan font-weight="700" fill="#2f7d5b">Expo Router</tspan> <tspan fill="#5f6f6a">(file-based routing)</tspan></text>

  <!-- ===== Logic ===== -->
  <rect x="350" y="206" width="270" height="94" rx="12" fill="#f4f7f6" stroke="#cfd8d4" stroke-width="1.5"/>
  <text x="368" y="230" font-size="12" font-weight="700" fill="#5f6f6a">LOGIC</text>
  <text x="368" y="256" font-size="11.5" fill="#243029"><tspan font-weight="700">Role</tspan> — the sign-up form rules</text>
  <text x="368" y="280" font-size="11.5" fill="#243029"><tspan font-weight="700">Uses</tspan> — <tspan font-weight="700" fill="#2f7d5b">validation.js</tspan> <tspan fill="#5f6f6a">(our own code)</tspan></text>

  <!-- ===== Data ===== -->
  <rect x="660" y="206" width="300" height="94" rx="12" fill="#f4f7f6" stroke="#cfd8d4" stroke-width="1.5"/>
  <text x="678" y="230" font-size="12" font-weight="700" fill="#5f6f6a">DATA</text>
  <text x="678" y="256" font-size="11.5" fill="#243029"><tspan font-weight="700">Role</tspan> — remembering your info <tspan fill="#5f6f6a">(no server)</tspan></text>
  <text x="678" y="280" font-size="11.5" fill="#243029"><tspan font-weight="700">Uses</tspan> — <tspan font-weight="700" fill="#2f7d5b">useState</tspan> <tspan fill="#5f6f6a">(React hook)</tspan> + <tspan font-weight="700" fill="#2f7d5b">AsyncStorage</tspan> <tspan fill="#5f6f6a">(library)</tspan></text>

  <!-- ===== Glossary ===== -->
  <rect x="30" y="326" width="920" height="118" rx="12" fill="#f7f9f8" stroke="#e3e9e7" stroke-width="1.5"/>
  <text x="50" y="350" font-size="12" font-weight="700" fill="#5f6f6a">WHAT EACH TOOL IS</text>
  <g font-size="11.5" fill="#243029">
    <text x="50" y="376"><tspan font-weight="700" fill="#2f7d5b">React Native</tspan> — framework for building iOS &amp; Android apps</text>
    <text x="50" y="400"><tspan font-weight="700" fill="#2f7d5b">NativeWind</tspan> — Tailwind CSS styling, inside React Native</text>
    <text x="50" y="424"><tspan font-weight="700" fill="#2f7d5b">Expo Router</tspan> — navigation where each file is a screen</text>
    <text x="510" y="376"><tspan font-weight="700" fill="#2f7d5b">validation.js</tspan> — our own function that checks the form</text>
    <text x="510" y="400"><tspan font-weight="700" fill="#2f7d5b">useState</tspan> — React's built-in memory for one screen</text>
    <text x="510" y="424"><tspan font-weight="700" fill="#2f7d5b">AsyncStorage</tspan> — saves small data on the device</text>
  </g>
</svg>
